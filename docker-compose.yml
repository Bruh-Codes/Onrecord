name: sme

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: sme
      POSTGRES_PASSWORD: sme
      POSTGRES_DB: sme
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sme -d sme"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin} &&
      mc mb -p local/sme-documents
      "

  api:
    build: ./apps/api
    command: sh -c "alembic upgrade head && uvicorn app.api.main:app --host 0.0.0.0 --port 8000 --reload"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app
    environment:
      DATABASE_URL: postgresql+asyncpg://sme:sme@postgres:5432/sme
      DATABASE_URL_SYNC: postgresql+psycopg://sme:sme@postgres:5432/sme
      REDIS_URL: redis://redis:6379/0
      BETTER_AUTH_JWKS_URL: http://localhost:3000/api/auth/jwks
      BETTER_AUTH_ISSUER: ${BETTER_AUTH_URL:-http://localhost:3000}
      BETTER_AUTH_AUDIENCE: ${BETTER_AUTH_URL:-http://localhost:3000}
      STORAGE_ENDPOINT_URL: http://localhost:9000
      STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      STORAGE_BUCKET: sme-documents

  worker:
    build: ./apps/api
    command: celery -A app.workers.celery_app worker --loglevel INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/api:/app
    environment:
      DATABASE_URL: postgresql+asyncpg://sme:sme@postgres:5432/sme
      DATABASE_URL_SYNC: postgresql+psycopg://sme:sme@postgres:5432/sme
      REDIS_URL: redis://redis:6379/0
      STORAGE_ENDPOINT_URL: http://localhost:9000
      STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      STORAGE_BUCKET: sme-documents

volumes:
  pgdata:
  redisdata:
  miniodata:
